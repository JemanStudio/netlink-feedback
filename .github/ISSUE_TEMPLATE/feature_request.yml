name: Feature request
description: Suggest an idea for Netlink.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How would you like Netlink to handle it?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
